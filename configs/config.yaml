# MRI Super Resolution - 2.5D U-Net Configuration

data:
  train_lf_dir: "train/low_field"
  train_hf_dir: "train/high_field"
  test_lf_dir: "test/low_field"
  train_csv: "train.csv"
  val_samples: ["017", "018"]           # holdout for early stopping
  num_slices: 200                      # axial slices per volume
  slice_context: 5                     # adjacent slices as input channels
  target_shape: [179, 221, 200]        # HF volume shape (trilinear upsample target)

model:
  base_features: 64                    # encoder start channels (64 generalized better than 96)
  # Encoder: 64 -> 128 -> 256 -> 512, Bottleneck: 1024
  attention: "none"                    # options: "none", "se"
  se_reduction: 16                     # channel reduction ratio for SE attention

training:
  epochs: 400
  batch_size: 12
  lr: 1.0e-3
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  adam_betas: [0.9, 0.99]
  lr_warmup_steps: 500
  gradient_clip_norm: 1.0
  use_amp: true
  ema_decay: 0.999
  early_stopping_patience: 50           # stop if val MS-SSIM doesn't improve for N epochs
  num_workers: 4

loss:
  l1_weight: 0.16                      # Charbonnier L1 (Zhao et al. 2018)
  msssim_weight: 0.84                  # MS-SSIM loss (Phase 2 metric)

augmentation:
  crop_size: null                      # full-slice (179x221) required for 5-scale MS-SSIM
  horizontal_flip: true
  vertical_flip: true
  rotation_90: false                   # disabled — non-square slices (179x221)
  intensity_scale: [0.9, 1.1]
  intensity_scale_prob: 0.5
  gaussian_noise_std: 0.01
  gaussian_noise_prob: 0.3

inference:
  tta: true                            # 4-way flip TTA
  histogram_matching: false            # disabled - hurts score
