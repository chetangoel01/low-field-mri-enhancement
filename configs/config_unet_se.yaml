# 2.5D U-Net challenger with lightweight channel attention (SE)

data:
  train_lf_dir: "train/low_field"
  train_hf_dir: "train/high_field"
  test_lf_dir: "test/low_field"
  train_csv: "train.csv"
  val_samples: ["017", "018"]
  num_slices: 200
  slice_context: 5
  target_shape: [179, 221, 200]

model:
  base_features: 64
  attention: "se"
  se_reduction: 16

training:
  epochs: 400
  batch_size: 12
  lr: 1.0e-3
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  adam_betas: [0.9, 0.99]
  lr_warmup_steps: 500
  gradient_clip_norm: 1.0
  use_amp: true
  ema_decay: 0.999
  early_stopping_patience: 50
  num_workers: 4

loss:
  l1_weight: 0.16
  msssim_weight: 0.84

augmentation:
  crop_size: null
  horizontal_flip: true
  vertical_flip: true
  rotation_90: false
  intensity_scale: [0.9, 1.1]
  intensity_scale_prob: 0.5
  gaussian_noise_std: 0.01
  gaussian_noise_prob: 0.3

inference:
  tta: true
  histogram_matching: false
